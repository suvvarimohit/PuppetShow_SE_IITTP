name: Deploy Puppet Story Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble browser app
        run: |
          mkdir -p _site
          cp index.html puppet-show.html input.js app.js moments.js style.css ai-config.js MOVEMENT_DEMO.txt _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Deploy Cloudflare AI Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          command: deploy
      - name: Note skipped Worker deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo 'Cloudflare Worker deployment skipped; add the CLOUDFLARE_API_TOKEN repository secret to enable it.'
