<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#120d19">
 <title>Puppet Story Studio · Story input</title>
 <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,800;1,900&display=swap">
 <link rel="stylesheet" href="style.css?v=20261114-finished-ui-workers-1">
</head>
<body class="input-view">
 <header class="site-head">
  <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">✦</span><b>Puppet Story Studio</b></a>
  <span class="head-note">Runs in your browser</span>
 </header>
 <main>
  <section class="input-page-grid">
   <section class="input-panel page-input">
    <div class="panel-title"><h2>Your story</h2></div>
    <textarea id="storyInput" spellcheck="true" aria-label="Story text" placeholder="Paste your story here, or open a .txt file…"></textarea>
    <div class="input-foot"><span id="wordCount">0 words</span><label class="file-pick">↑ <span>Open .txt</span><input id="fileInput" type="file" accept=".txt,text/plain"></label></div>
    <button id="continue" class="generate"><span class="gen-icon">✦</span><span><b>Create my puppet show</b><small>Creates and plays your show</small></span><strong>→</strong></button>
    <p class="privacy-note">Your story stays on this device.</p>
   </section>
   <aside class="estimate-panel" aria-live="polite">
    <div>
     <h2>See how your story could become a show</h2>
     <div class="estimate" id="estimate"><b>Estimated suitability</b><span id="estimateText">Paste a story to estimate how much can become a character-led puppet show.</span></div>
    </div>
    <div class="lineup" aria-hidden="true">
     <img src="assets/puppets/human-templates/p1-queen.png" alt="" style="--i:0;--h:82%">
     <img src="assets/puppets/human-templates/p1-king.png" alt="" style="--i:1;--h:100%">
     <img src="assets/puppets/human-templates/p2-hanuman.png" alt="" style="--i:2;--h:74%">
     <img src="assets/puppets/human-templates/p2-demon.png" alt="" style="--i:3;--h:86%">
     <img src="assets/puppets/animal-templates/p8-lion.png" alt="" style="--i:4;--h:52%">
    </div>
   </aside>
  </section>
 </main>

 <div id="toast" role="status" class="toast"></div>
 <script src="input.js?v=20261114-boat-arrow-scenes"></script>
</body>
</html>
